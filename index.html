<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take a Walk Fight</title>

<style>

html,body{
    margin:0;
    width:100%;
    min-height:100vh;
}

body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

#game{
    width:100%;
    max-width:900px;
    margin:auto;
}

.row{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.card{
    width:60px;
    background:#222;
    border:1px solid #555;
    padding:5px;
}

.card img{
    width:100%;
    height:60px;
    object-fit:cover;
}

.boss-card{
    width:95%;
    max-width:100px;
    margin:auto;
    background:#222;
    border:1px solid #555;
    padding:5px;
}

.boss-card img{
    width:100%;
    height:100px;
    object-fit:cover;
}

.bar{
    width:100%;
    height:18px;
    background:#333;
}

.hp{
    height:100%;
    background:red;
}

.note{
    position:fixed;
    font-size:32px;
    pointer-events:none;
    z-index:9999;
}

.water{
    position:fixed;
    height:12px;
    background:
    linear-gradient(
        to right,
        cyan,
        white,
        cyan
    );
    border-radius:20px;
    pointer-events:none;
    z-index:9999;
}

button{
    padding:8px 15px;
    margin:4px;
    font-size:16px;
}

#actions{
    margin-top:15px;
}

#log{
    width:95%;
    max-width:800px;
    height:80px;
    overflow-y:auto;
    background:#222;
    text-align:left;
    margin:auto;
    margin-top:15px;
    padding:10px;
}

#selection{
    margin:20px auto;
    max-width:800px;
}

#selection .card{
    width:80px;
    padding:8px;
    cursor:pointer;
}

#selection .card.selected{
    border:2px solid gold;
    background:#333;
}

</style>

</head>
<body>

<div id="selection">
<h1>Choose Characters For Team</h1>
<div class="row" id="selectRow"></div>
<button onclick="startBattle()">START BATTLE</button>
</div>

<div id="game" style="display:none;">

<h1 id="battleTitle">⚔ Battle ⚔</h1>

<div class="row" id="teamRow"></div>

<br>

<div class="boss-card">
<img src="https://i.ibb.co/yFSZkjLD/5.jpg">
<h2 id="bossName"></h2>
<div class="bar">
<div class="hp" id="bossHP"></div>
</div>
<p id="bossText"></p>
</div>

<h2 id="turnText"></h2>

<div id="actions">
<button onclick="attack()">Attack</button>
<button onclick="skill()">Skill 1</button>
<button onclick="skill2()">Skill 2</button>
</div>

<div id="log"></div>

</div>

<script>

let roster = [
"Kaito",
"Elena",
"Ryker",
"Aria",
"Neria"
];

let teamData = [

{
name:"Kaito",
hp:120,
maxHp:120,
atk:10,
cd:0,
hide:0,
dot:0
},

{
name:"Elena",
hp:100,
maxHp:100,
atk:5,
cd:0,
dot:0
},

{
name:"Ryker",
hp:130,
maxHp:130,
atk:15,
cd:0,
dot:0
},

{
name:"Aria",
hp:110,
maxHp:110,
atk:20,
cd:0,
dot:0
},

{
name:"Neria",
hp:90,
maxHp:90,
atk:0,
cd:0,
dot:0,
injure:false,
img:"https://i.ibb.co/C3VhWsz3/image.png",
injureImg:"https://i.ibb.co/hJ8J0Q4C/image.png"
},

{
name:"Ren",
hp:120,
maxHp:120,
atk:0,
skill1Cd:0,
skill2Cd:0,
immortal:0
}

];

function resetCharacters(){

allCharacters = JSON.parse(JSON.stringify([
{
name:"Kaito",
hp:120,
maxHp:120,
atk:10,
cd:0,
hide:0,
dot:0
},
{
name:"Elena",
hp:100,
maxHp:100,
atk:5,
cd:0,
dot:0
},
{
name:"Ryker",
hp:130,
maxHp:130,
atk:15,
cd:0,
dot:0
},
{
name:"Aria",
hp:110,
maxHp:110,
atk:20,
cd:0,
dot:0
},
{
name:"Neria",
hp:90,
maxHp:90,
atk:0,
cd:0,
dot:0,
injure:false,
img:"https://i.ibb.co/C3VhWsz3/image.png",
injureImg:"https://i.ibb.co/hJ8J0Q4C/image.png"
},
{
name:"Ren",
hp:120,
maxHp:120,
atk:0,
skill1Cd:0,
skill2Cd:0,
immortal:0
}
]));

}

let team=[];

let phase = 1;
let boss = {
name:"Binbin",
hp:25,
maxHp:25,
atk:5,
skillCd:0,
img:"https://i.ibb.co/yB4Qmtrf/binbin.png"
};

let selected = [];
let allCharacters = [...teamData];
let lastTurn = -1;
let skipCount = [];
let turn = 0;
let speedBuff=0;
let cdBuffTurns = 0;

const logDiv = document.getElementById("log");

function log(t){
    logDiv.innerHTML += "Orion: " + t + "<br>";
    logDiv.scrollTop = logDiv.scrollHeight;
}

function choose(name){
    if(selected.includes(name)){
        selected = selected.filter(x => x !== name);
    }else{
        selected.push(name);
    }
}

function renderSelection(){
    const row = document.getElementById("selectRow");
    row.innerHTML = "";
    roster.forEach((name, idx) => {
        const div = document.createElement("div");
        div.className = `card ${selected.includes(name) ? 'selected' : ''}`;
        div.innerHTML = `<img src="https://i.ibb.co/${['hF69DM0M','Wvwd2Tcx','35mZkCmg','b52T8jRr','C3VhWsz3','VcQQyTk5'][idx]}/1.jpg"><h3>${name}</h3>`;
        div.onclick = () => { choose(name); renderSelection(); };
        row.appendChild(div);
    });
}

function startPhase2(){

phase = 2;

roster.push("Ren");

resetCharacters();

selected = [];

document.getElementById("game").style.display="none";
document.getElementById("selection").style.display="block";

document.querySelector("#selection h1").innerText =
"Choose Characters For Team (Phase 2)";

renderSelection();

boss = {
name:"Grinder Saw",
hp:500,
maxHp:500,
atk:28,
skillCd:5,
img:"https://i.ibb.co/yFSZkjLD/5.jpg"
};

log("🎉 Binbin defeated!");
log("⭐ Ren joined the roster!");
}

function startBattle(){
if(selected.length === 0){
    alert("Choose at least 1 character!");
    return;
}

    team = allCharacters.filter(p => selected.includes(p.name));
    skipCount = new Array(team.length).fill(0);
    turn = Math.floor(Math.random()*team.length);

    // Render only selected team cards
    const teamRow = document.getElementById("teamRow");
    teamRow.innerHTML = "";
    team.forEach((p, i) => {
        const cardHTML = `
            <div class="card">
                <img src="${p.name==='Neria' ? 'https://i.ibb.co/C3VhWsz3/7.jpg' : 
                    p.name==='Kaito' ? 'https://i.ibb.co/hF69DM0M/1.jpg' :
                    p.name==='Elena' ? 'https://i.ibb.co/Wvwd2Tcx/2.jpg' :
                    p.name==='Ryker' ? 'https://i.ibb.co/35mZkCmg/3.jpg' :
p.name==='Ren' ?
'https://i.ibb.co/VcQQyTk5/20.jpg' :
                    'https://i.ibb.co/b52T8jRr/4.jpg'}">
                <h3>${p.name}</h3>
                <div class="bar">
                    <div class="hp" id="hp${i}"></div>
                </div>
                <p id="txt${i}"></p>
            </div>
        `;
        teamRow.innerHTML += cardHTML;
    });

    document.getElementById("selection").style.display = "none";
    document.getElementById("game").style.display = "block";

    update();
}

function update(){

document.getElementById("battleTitle").innerText =
"⚔ " + boss.name + " Battle ⚔";

document.getElementById("bossName").innerText = boss.name;
document.querySelector(".boss-card img").src = boss.img;

    for(let i=0; i<team.length; i++){
        let p = team[i];
        let card = document.querySelectorAll("#teamRow .card img")[i];

        if(p.hide > 0){
            card.style.opacity = "0";
        }else{
            card.style.opacity = "1";
        }

        if(p.name==="Neria"){
            card.src = p.injure ? 
                "https://i.ibb.co/hJ8J0Q4C/image.png" : 
                "https://i.ibb.co/C3VhWsz3/image.png";
        }

        document.getElementById("hp"+i).style.width = (p.hp/p.maxHp*100)+"%";

let cdText="";

if(p.name==="Ren"){

    cdText = "";

    if(p.skill1Cd > 0){
        cdText +=
        " CD1:" +
        p.skill1Cd;
    }

    if(p.skill2Cd > 0){
        cdText +=
        " CD2:" +
        p.skill2Cd;
    }

}
else{

    cdText =
    p.cd > 0
    ? " CD:"+p.cd
    : "";

}

        document.getElementById("txt"+i).innerText = p.hp+"/"+p.maxHp + cdText + (p.hide>0?" HIDDEN":"");
    }

    document.getElementById("bossHP").style.width = (boss.hp/boss.maxHp*100)+"%";
    document.getElementById("bossText").innerText = boss.hp+"/"+boss.maxHp;

    let c = 0;
    while(team[turn].hp <= 0 && c < team.length){
        turn++;
        if(turn >= team.length) turn = 0;
        c++;
    }

    document.getElementById("turnText").innerText = "Turn: " + team[turn].name;
}

function nextTurn(){

if(boss.hp<=0){

    if(phase===1){

        startPhase2();
        return;

    }

    log("🎉 Victory!");
    disable();
    return;
}

let alive = team.filter(p => p.hp > 0);

if(alive.length === 0){
    log("💀 Defeat!");
    disable();
    return;
}

let othersAlive =
team.filter(
    m => m.name !== "Neria" && m.hp > 0
).length;

let neria =
team.find(
    m => m.name==="Neria"
);

if(
    neria &&
    neria.hp > 0 &&
    othersAlive === 0 &&
    !neria.injure
){
    neria.injure = true;
    neria.atk = 55;

    log(
        "🔥 Neria entered INJURE state!"
    );
}

for(let p of team){

    if(p.name==="Ren"){

        p.skill1Cd =
        Math.max(
            0,
            p.skill1Cd-1
        );

        p.skill2Cd =
        Math.max(
            0,
            p.skill2Cd-1
        );

        if(p.immortal>0){
            p.immortal--;
        }

    }

    let reduce = 1;

    if(
        cdBuffTurns > 0 &&
        p.name !== "Ryker"
    ){
        reduce = 2;
    }

    p.cd =
    Math.max(
        0,
        p.cd - reduce
    );

    if(p.hide > 0){
        p.hide--;
    }

    if(p.dot > 0){

        if(p.name === "Ren"){

            p.dot = 0;

            log(
                "👻 Ren is immune to Bleed because he is an Illusion!"
            );

        }else{

            p.hp -= 10;
            p.dot--;

            if(p.hp < 0){
                p.hp = 0;
            }

            log(
                p.name +
                " takes 10 bleed damage"
            );

        }

    }

    if(p.hp > 0){

        if(p === team[turn]){

            skipCount[
                team.indexOf(p)
            ] = 0;

        }else{

            skipCount[
                team.indexOf(p)
            ]++;

        }

    }

}

if(cdBuffTurns > 0){
    cdBuffTurns--;
}

let priority = [];

for(let i=0;i<team.length;i++){

    if(
        team[i].hp > 0 &&
        skipCount[i] >= 3
    ){
        priority.push(i);
    }

}

if(priority.length > 0){

    turn =
    priority[
        Math.floor(
            Math.random()*priority.length
        )
    ];

}else{

    let aliveIdx =
    team.map((p,i)=>i)
    .filter(i =>
        team[i].hp > 0 &&
        i !== lastTurn
    );

    if(aliveIdx.length === 0){

        aliveIdx =
        team.map((p,i)=>i)
        .filter(i =>
            team[i].hp > 0
        );

    }

    turn =
    aliveIdx[
        Math.floor(
            Math.random()*aliveIdx.length
        )
    ];

}

lastTurn = turn;
skipCount[turn] = 0;

bossTurn();
update();
}

function attack(){

    let p = team[turn];

    if(p.hp<=0) return;

    if(p.name==="Ren"){

        renIllusionBeam();

        if(
            boss.hp <=
            boss.maxHp * 0.10
        ){

            boss.hp = 0;

            log(
                "👻 Ren erased the boss with Illusion Water!"
            );

        }else{

            log(
                "👻 Ren used Illusion Water"
            );

        }

        update();
        nextTurn();
        return;

    }

    let bonus =
    speedBuff>0 ? 10 : 0;

let dmg;

if(p.name==="Neria" && !p.injure){

    dmg = 0;

}else{

    dmg =
    p.atk +
    Math.floor(Math.random()*8) +
    bonus;

}

    boss.hp -= dmg;

    if(boss.hp<0)
    boss.hp=0;

if(p.name==="Neria" && !p.injure){

    log("Neria cannot attacks, auto skip turn");

}
else if(
    p.name === "Neria" &&
    p.injure
){
    log(
        p.name +
        " attacks by INJURE for " +
        dmg
    );
}

    else if(p.name==="Kaito"){
        log(p.name+" attacks for "+dmg);
    }
    else if(p.name==="Elena"){
        log(p.name+" swings staff for "+dmg);
    }
    else if(p.name==="Ryker"){
        log(p.name+" punches for "+dmg);
    }
    else if(p.name==="Aria"){
        log(p.name+" swings flute for "+dmg);
    }
    if(speedBuff>0) speedBuff--;

    update();
    nextTurn();
}

function ariaNotes(){
    let ariaIndex = team.findIndex(p => p.name === "Aria");
    if(ariaIndex === -1) return;
    let img = document.querySelectorAll("#teamRow .card img")[ariaIndex];
    let rect = img.getBoundingClientRect();
    let cx = rect.left + rect.width/2;
    let cy = rect.top + rect.height/2;

    for(let i=0;i<8;i++){
        let note = document.createElement("div");
        note.className = "note";
        note.innerHTML = "🎶";
        document.body.appendChild(note);

        let ang = i*Math.PI*2/8;
        let dist = 50;

        note.style.left = cx+"px";
        note.style.top = cy+"px";

        note.animate([
        {transform:"translate(0,0)", opacity:1},
        {transform:`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`, opacity:0}
        ],{
            duration:1000,
            easing:"linear"
        });

        setTimeout(()=>note.remove(),1000);
    }
}

function waterBeam(){
    let neriaIndex = team.findIndex(p => p.name === "Neria");
    if(neriaIndex === -1) return;
    let neriaImg = document.querySelectorAll("#teamRow .card img")[neriaIndex];
    let bossImg = document.querySelector(".boss-card img");

    let a = neriaImg.getBoundingClientRect();
    let b = bossImg.getBoundingClientRect();

    let beam = document.createElement("div");
    beam.className = "water";

    let x1 = a.left + a.width/2;
    let y1 = a.top + a.height/2;
    let x2 = b.left + b.width/2;
    let y2 = b.top + b.height/2;

    let len = Math.hypot(x2-x1, y2-y1);
    let ang = Math.atan2(y2-y1, x2-x1)*180/Math.PI;

    beam.style.left = x1+"px";
    beam.style.top = y1+"px";
    beam.style.width = len+"px";
    beam.style.transform=`rotate(${ang}deg)`;
    beam.style.transformOrigin="left center";

    document.body.appendChild(beam);
    setTimeout(()=>beam.remove(),300);
}

function renIllusionBeam(){

    let renIndex =
    team.findIndex(
        p => p.name==="Ren"
    );

    if(renIndex===-1) return;

    let renImg =
    document.querySelectorAll(
        "#teamRow .card img"
    )[renIndex];

    let bossImg =
    document.querySelector(
        ".boss-card img"
    );

    let a =
    renImg.getBoundingClientRect();

    let b =
    bossImg.getBoundingClientRect();

    let beam =
    document.createElement("div");

    beam.className="water";

    let x1=a.left+a.width/2;
    let y1=a.top+a.height/2;

    let x2=b.left+b.width/2;
    let y2=b.top+b.height/2;

    let len=
    Math.hypot(
        x2-x1,
        y2-y1
    );

    let ang=
    Math.atan2(
        y2-y1,
        x2-x1
    )*180/Math.PI;

    beam.style.left=x1+"px";
    beam.style.top=y1+"px";

    beam.style.width=len+"px";

    beam.style.height="20px";

    beam.style.opacity="0.35";

    beam.style.filter=
    "blur(6px)";

    beam.style.background=
    "linear-gradient(to right,#666,#bbb,#666)";

    beam.style.transform=
    `rotate(${ang}deg)`;

    beam.style.transformOrigin=
    "left center";

    document.body.appendChild(
        beam
    );

    setTimeout(
        ()=>beam.remove(),
        400
    );

}

function renSpears(){

for(let i=0;i<15;i++){

setTimeout(()=>{

let line=document.createElement("div");

line.style.position="fixed";
line.style.left=(window.innerWidth*0.55+
Math.random()*120-60)+"px";

line.style.top="-300px";

line.style.width="8px";
line.style.height="300px";

line.style.background="#999";

line.style.zIndex="9999";

document.body.appendChild(line);

line.animate([
{transform:"translateY(0px)"},
{transform:"translateY(900px)"}
],{
duration:350,
easing:"linear"
});

setTimeout(()=>line.remove(),350);

},i*40);

}

}

function renBlackStripes(callback){

for(let i=0;i<12;i++){

let s=document.createElement("div");

s.style.position="fixed";
s.style.left="-300px";
s.style.top=(i*80)+"px";

s.style.width="300px";
s.style.height="40px";

s.style.background="black";
s.style.zIndex="9999";

document.body.appendChild(s);

s.animate([
{transform:"translateX(0px)"},
{transform:`translateX(${window.innerWidth+500}px)`}
],{
duration:1200,
iterations:2
});

setTimeout(()=>s.remove(),2400);

}

setTimeout(callback,2400);

}

function skill(){
    let p = team[turn];

    if(p.hp<=0){
        nextTurn();
        return;
    }

if(p.cd > 0){
    log("Skill cooldown!");
    return;
}

    if(p.name==="Kaito"){
        p.hide=3;
        p.cd=5;
        log("Kaito used Fool Hat!");
    }
    else if(p.name==="Elena"){
        p.cd=3;
        for(let m of team){
            if(m.hp>0){
                m.hp=Math.min(m.maxHp,m.hp+35);
            }
        }
        log("Elena used Heal Staff!");
    }
    else if(p.name==="Ryker"){
        speedBuff = 3;
        cdBuffTurns = 3;
        p.cd = 4;
        log("Ryker used Speed Boost!");
    }
    else if(p.name==="Aria"){
        ariaNotes();
        p.cd=3;
        let total=0;
        for(let i=0;i<5;i++){
            total+=8+Math.floor(Math.random()*8);
        }
        boss.hp-=total;
        if(boss.hp<0) boss.hp=0;
        log("Aria used Bash Song for "+total);
    }
    else if(p.name==="Neria"){
        p.cd = 4;
        waterBeam();

        const wasAlive = boss.hp > 0;
        if(boss.hp <= boss.maxHp*0.25){
            boss.hp = 0;
        }

        if(boss.hp <= 0 && wasAlive){
            for(let m of team){
                if(m.hp>0){
                    m.hp = Math.min(m.maxHp, m.hp+25);
                }
            }
            log("💧 Neria executed the boss and healed the team!");
        }else{
            log("💧 Neria used Water Execution!");
        }
    }

else if(p.name==="Ren"){

    if(p.skill1Cd>0){
        log("Skill 1 cooldown!");
        return;
    }

    p.skill1Cd=5;

    renSpears();

    let dmg=
    80+
    Math.floor(
        Math.random()*31
    );

    boss.hp-=dmg;

    if(boss.hp<0)
    boss.hp=0;

    log(
        "⚔ Ren telekinesis The Metal for "+
        dmg
    );

}

    update();
    nextTurn();
}

function skill2(){

let p=team[turn];

if(
    !p ||
    p.hp<=0
){
    return;
}

if(
    p.name!=="Ren"
){
    log(
        "Only Ren has Skill 2!"
    );
    return;
}

if(
    p.skill2Cd>0
){
    log(
        "Skill 2 cooldown!"
    );
    return;
}

p.skill2Cd=7;

p.immortal=2;

renBlackStripes(()=>{

    let dmg=
    140+
    Math.floor(
        Math.random()*41
    );

    boss.hp-=dmg;

    if(boss.hp<0)
    boss.hp=0;

    update();

    log(
        "🖤 Ren used Illusion Erasure for "+
        dmg
    );

});

update();
nextTurn();

}

function bossTurn(){
    if(boss.hp<=0) return;

if(phase===1){

let targets=team.filter(p=>p.hp>0);

if(targets.length===0) return;

let t=targets[
Math.floor(Math.random()*targets.length)
];

let dmg =
boss.atk +
Math.floor(Math.random()*9) - 4;

t.hp-=dmg;

if(t.hp<0) t.hp=0;

log("🌱 Binbin hits "+t.name+" for "+dmg);

return;

}

    let targets=team.filter(p=>p.hp>0);
    if(targets.length===0) return;

    let t=targets[Math.floor(Math.random()*targets.length)];

    if(t.name==="Kaito" && t.hide>0){
        log("🌀 Grinder Saw attacked Kaito, but Fool Hat avoided the attack!");
        return;
    }
