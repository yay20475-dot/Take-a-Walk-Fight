<title>Take a Walk Fight</title>

<style>

html,body{
    margin:0;
    width:100%;
    min-height:100vh;
}

body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

#game{
    width:100%;
    max-width:900px;
    margin:auto;
}

.row{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.card{
    width:60px;
    background:#222;
    border:1px solid #555;
    padding:5px;
}

.card img{
    width:100%;
    height:60px;
    object-fit:cover;
}

.boss-card{
    width:95%;
    max-width:100px;
    margin:auto;
    background:#222;
    border:1px solid #555;
    padding:5px;
}

.boss-card img{
    width:100%;
    height:100px;
    object-fit:cover;
}

.bar{
    width:100%;
    height:18px;
    background:#333;
}

.hp{
    height:100%;
    background:red;
}

.note{
    position:fixed;
    font-size:32px;
    pointer-events:none;
    z-index:9999;
}

.water{
    position:fixed;
    height:12px;
    background:
    linear-gradient(
        to right,
        cyan,
        white,
        cyan
    );
    border-radius:20px;
    pointer-events:none;
    z-index:9999;
}

.buzzsaw{
    position:fixed;
    width:50px;
    height:50px;
    background:
    radial-gradient(circle,#eee 20%,#999 45%,#555 70%,#333 100%);
    clip-path:polygon(
    50% 0%,
    60% 12%,
    78% 2%,
    75% 22%,
    98% 22%,
    85% 40%,
    100% 50%,
    85% 60%,
    98% 78%,
    75% 78%,
    78% 98%,
    60% 88%,
    50% 100%,
    40% 88%,
    22% 98%,
    25% 78%,
    2% 78%,
    15% 60%,
    0% 50%,
    15% 40%,
    2% 22%,
    25% 22%,
    22% 2%,
    40% 12%
    );
    z-index:9999;
    pointer-events:none;
animation:sawSpin .08s linear infinite;
}

.buzzsaw::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    background:#111;
    border:2px solid #bbb;
    border-radius:50%;
    transform:translate(-50%,-50%);
}

@keyframes sawSpin{
    from{
        rotate:0deg;
    }
    to{
        rotate:360deg;
    }
}

button{
    padding:8px 15px;
    margin:4px;
    font-size:16px;
}

#actions{
    margin-top:15px;
}

#log{
    width:95%;
    max-width:800px;
    height:80px;
    overflow-y:auto;
    background:#222;
    text-align:left;
    margin:auto;
    margin-top:15px;
    padding:10px;
}

#selection{
    margin:20px auto;
    max-width:800px;
}

#selection .card{
    width:80px;
    padding:8px;
    cursor:pointer;
}

#selection .card.selected{
    border:2px solid gold;
    background:#333;
}

</style>

        selected.filter(

        selected.push(name);

}

function attack(){

    let p = team[turn];

    if(p.hp<=0) return;

let bonus =
(speedBuff>0 ? 10 : 0) +
(miloBuffTurns>0 ? 5 : 0);

let dmg;

if(
    (p.name==="Neria" && !p.injure) ||
    p.name==="Bilo" ||
    p.name==="Milo" ||
    p.name==="Ren"
){

    dmg = 0;

}else{

let realAtk = p.atk;

if(p.name==="Mireia"){
    realAtk += p.huntBuff || 0;
}

    if(p.freezeTurns > 0){
        realAtk = Math.max(1, realAtk - 10);
    }
if(p.name==="Maniespera"){

    dmg =
    realAtk +
    Math.floor(Math.random()*20) +
    bonus;

}else if(p.name==="Jilo"){

    dmg =
    realAtk +
    Math.floor(Math.random()*100) +
    bonus;

}else{

    dmg =
    realAtk +
    Math.floor(Math.random()*8) +
    bonus;

}
}

    boss.hp -= dmg;

    if(boss.hp<0)
    boss.hp=0;

if(p.name==="Neria" && !p.injure){
    log("Neria cannot attacks, auto skip turn");
}

if(p.name==="Ren"){
    log("Ren cannot attacks, auto skip turn");
}

if(p.name==="Bilo"){

function skill(){
    let p = team[turn];

    if(p.hp<=0){
        nextTurn();
        return;
    }

if(p.cd > 0){
    log("Skill cooldown!");
    return;
}

    if(p.name==="Kaito"){
        p.hide=3;
        p.cd=10;
        log("🎩🌀 Kaito used Fool Hat!");
    }
    else if(p.name==="Elena"){
        p.cd=3;
        for(let m of team){
            if(m.hp>0){
                m.hp=Math.min(m.maxHp,m.hp+35);
            }
        }
        log("Elena used Heal Staff!");
    }
    else if(p.name==="Ryker"){
        speedBuff = 3;
        cdBuffTurns = 3;
